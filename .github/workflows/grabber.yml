name: Universal-Cloud-Grabber
on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Paste Direct Link or user/repo'
        required: true
  push:
    paths:
      - 'GIMME-LINKS.txt'

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: sudo apt-get update && sudo apt-get install -y wget curl

      - name: Core Engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${{ github.event.inputs.link }}"
          if [ -z "$URL" ]; then URL=$(cat GIMME-LINKS.txt | xargs); fi
          
          mkdir -p downloads
          # 1. NUKE OLD FILES (Self-Cleaning)
          rm -rf downloads/*
          
          if [ -z "$URL" ]; then echo "No link provided."; exit 0; fi

          # 2. IDENTIFY TYPE
          # Clean slashes
          URL_CLEAN=$(echo "$URL" | sed 's|/*$||')
          
          if [[ "$URL_CLEAN" == *"github.com"* ]] || [[ "$URL_CLEAN" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9._-]+$ ]]; then
             echo "📦 TYPE: GitHub Repository"
             # Extract user/repo
             if [[ "$URL_CLEAN" == *"github.com"* ]]; then
                TARGET=$(echo "$URL_CLEAN" | sed -E 's|.*github.com/([^/]+)/([^/ ]+).*|\1/\2|' | cut -d'/' -f1,2)
             else
                TARGET="$URL_CLEAN"
             fi
             echo "Fetching all assets from: $TARGET"
             gh release download --repo "$TARGET" --pattern "*" --dir downloads --clobber || echo "No release assets found."
          
          else
             echo "🔗 TYPE: Direct Download Link"
             cd downloads
             # curl -L (follow redirects) -J (use server filename) -O (save to file)
             curl -L -O -J "$URL_CLEAN" || wget -q --show-progress "$URL_CLEAN"
             cd ..
          fi

          # 3. SMART SPLITTING (100MB Bypass)
          find downloads/ -type f -size +95M | while read FILE; do
            echo "✂️ Splitting: $FILE"
            split -b 95M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE.part"
            rm "$FILE"
          done

      - name: Update README UI
        run: |
          python3 - <<EOF
          import os, urllib.parse, re

          if not os.path.exists('downloads'): exit(0)
          files = sorted([f for f in os.listdir('downloads') if os.path.isfile(os.path.join('downloads', f))])
          
          ui_output = ""
          split_groups = set()

          if files:
              table = "### 📥 Current Downloads\n| File Name | Size | Link |\n| :--- | :--- | :--- |\n"
              for f in files:
                  size = f"{os.path.getsize('downloads/'+f) / (1024*1024):.1f} MB"
                  enc_name = urllib.parse.quote(f)
                  raw_url = f"https://github.com/${{ github.repository }}/blob/main/downloads/{enc_name}?raw=true"
                  table += f"| {f} | {size} | [⬇️ Download]({raw_url}) |\n"
                  if ".part" in f:
                      split_groups.add(f.split('.part')[0])
              
              ui_output = table
              if split_groups:
                  ui_output += "\n**🧩 Join Commands (Run these to merge parts):**\n"
                  for base in sorted(split_groups):
                      ui_output += f"- **Windows:** \`Get-Content downloads/{base}.part* -ReadCount 0 | Set-Content \"{base}\" -Encoding Byte\`\n"
                      ui_output += f"- **Linux/Mac:** \`cat downloads/{base}.part* > \"{base}\"\`\n"
          else:
              ui_output = "### 📥 No Active Downloads\n*Run a workflow to see files here.*"

          with open('README.md', 'r') as f: content = f.read()
          pattern = r"<!-- DL_START -->.*?<!-- DL_END -->"
          replacement = f"<!-- DL_START -->\n{ui_output}\n<!-- DL_END -->"
          content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          with open('README.md', 'w') as f: f.write(content)
          EOF

      - name: Push to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -a -m "🚀 Engine Sync" || exit 0
          git push --force
