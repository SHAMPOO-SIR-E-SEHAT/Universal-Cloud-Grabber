name: Universal-Cloud-Grabber
on:
  push:
    paths:
      - 'GIMME-LINKS.txt'
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg wget curl
          # Force update yt-dlp to the latest version to get the newest bot-bypass fixes
          python3 -m pip install -U yt-dlp

      - name: Smart Download
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(cat GIMME-LINKS.txt | xargs)
          mkdir -p downloads
          rm -rf downloads/*
          
          if [ -z "$URL" ]; then
            echo "Empty link file."
            exit 0
          fi

          echo "Processing: $URL"

          if [[ $URL =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            gh release download --repo "$URL" --archive zip --output "downloads/repo-source.zip"
          
          elif [[ $URL == *"youtube.com"* ]] || [[ $URL == *"youtu.be"* ]] || [[ $URL == *"twitter.com"* ]] || [[ $URL == *"tiktok.com"* ]] || [[ $URL == *"instagram.com"* ]]; then
            # The flags below are the current best way to bypass the "Sign in to confirm you're not a bot" error
            yt-dlp -f 'best' \
              --no-playlist \
              --extractor-args "youtube:player_client=android,web_embedded" \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -o "downloads/%(title)s.%(ext)s" "$URL"
          
          else
            wget -q --show-progress -N -P downloads/ "$URL" || curl -L -O --output-dir downloads/ "$URL"
          fi

      - name: Split and Generate UI
        id: process
        run: |
          # Split files larger than 90MB
          find downloads/ -type f -size +90M | while read FILE; do
            split -b 90M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE."
            rm "$FILE"
          done
          
          TABLE_DATA=""
          HAS_SPLIT="false"
          MAIN_NAME=""

          for f in $(ls downloads/ | sort -V); do
            SIZE=$(du -sh "downloads/$f" | cut -f1)
            ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$f'''))")
            RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/downloads/$ENC"
            TABLE_DATA="${TABLE_DATA}| $f | $SIZE | [Download]($RAW_URL) |\n"
            
            if [[ "$f" == *.[1-9] ]]; then
               HAS_SPLIT="true"
               MAIN_NAME="${f%.*}"
            fi
          done

          echo -e "$TABLE_DATA" > table_content.tmp
          echo "has_split=$HAS_SPLIT" >> $GITHUB_OUTPUT
          echo "main_name=$MAIN_NAME" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          SPLIT="${{ steps.process.outputs.has_split }}"
          FNAME="${{ steps.process.outputs.main_name }}"

          if [ "$SPLIT" = "true" ]; then
             L_CMD="cat \"downloads/$FNAME\".* > \"$FNAME\""
             W_CMD="Get-Content \"downloads/$FNAME\".* -ReadCount 10mb -Encoding Byte | Set-Content \"$FNAME\" -Encoding Byte"
          else
             L_CMD="# No parts to join!"
             W_CMD="# No parts to join!"
          fi

          # Use Python to safely inject the table into the README markers
          python3 - <<EOF
          import re
          
          with open('README.md', 'r') as f:
              content = f.read()

          try:
              with open('table_content.tmp', 'r') as f:
                  table = f.read()
          except:
              table = "| No files | - | - |"

          # Define replacement patterns
          patterns = {
              r"<!-- TABLE_START -->.*?<!-- TABLE_END -->": f"<!-- TABLE_START -->\n{table}\n<!-- TABLE_END -->",
              r"<!-- LINUX_CMD_START -->.*?<!-- LINUX_CMD_END -->": f"<!-- LINUX_CMD_START -->\n\`\`\`bash\n{L_CMD}\n\`\`\`\n<!-- LINUX_CMD_END -->",
              r"<!-- WIN_CMD_START -->.*?<!-- WIN_CMD_END -->": f"<!-- WIN_CMD_START -->\n\`\`\`powershell\n{W_CMD}\n\`\`\`\n<!-- WIN_CMD_END -->"
          }

          for pattern, replacement in patterns.items():
              content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Push to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated download and README update" || exit 0
          git push --force
