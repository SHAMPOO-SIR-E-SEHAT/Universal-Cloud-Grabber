- name: Smart Download
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(cat GIMME-LINKS.txt | xargs)
          mkdir -p downloads
          rm -rf downloads/*
          
          # SAFETY CHECK: If the file is empty, stop the download part but continue to update README
          if [ -z "$URL" ]; then
            echo "GIMME-LINKS is empty. Clearing all downloads..."
            echo "fname=empty" >> $GITHUB_OUTPUT
          
          # 1. GitHub Repo
          elif [[ $URL =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            gh release download --repo "$URL" --archive zip --output "downloads/repo-source.zip"
            echo "fname=repo-source.zip" >> $GITHUB_OUTPUT
            echo "fpath=downloads/repo-source.zip" >> $GITHUB_OUTPUT
          
          # 2. Video Sites
          elif [[ $URL == *"youtube.com"* ]] || [[ $URL == *"youtu.be"* ]] || [[ $URL == *"twitter.com"* ]] || [[ $URL == *"tiktok.com"* ]]; then
            yt-dlp -f 'best' -o "downloads/%(title)s.%(ext)s" "$URL"
            REAL_FILE=$(ls downloads/* | head -n 1)
            echo "fname=$(basename "$REAL_FILE")" >> $GITHUB_OUTPUT
            echo "fpath=$REAL_FILE" >> $GITHUB_OUTPUT
          
          # 3. Smart Web Scan
          else
            wget -r -l1 -nd -A "deb,exe,zip,msi,pkg,dmg,apk,rpm,gz,7z,rar" -P downloads/ "$URL" || curl -LJO "$URL" --output-dir downloads/
            REAL_FILE=$(ls downloads/* | head -n 1)
            echo "fname=$(basename "$REAL_FILE")" >> $GITHUB_OUTPUT
            echo "fpath=$REAL_FILE" >> $GITHUB_OUTPUT
          fi
