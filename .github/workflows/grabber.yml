name: Universal-Cloud-Grabber
on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Paste your download link here'
        required: true
        default: ''
  push:
    paths:
      - 'GIMME-LINKS.txt'

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: sudo apt-get update && sudo apt-get install -y wget curl

      - name: Core Engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use input from button OR the text file
          URL="${{ github.event.inputs.link }}"
          if [ -z "$URL" ]; then
            URL=$(cat GIMME-LINKS.txt | xargs)
          fi
          
          mkdir -p downloads
          rm -rf downloads/*
          
          if [ -z "$URL" ]; then echo "No link provided."; exit 0; fi

          # 1. GitHub Repo Logic
          if [[ $URL == *"github.com"* ]]; then
            CLEAN_REPO=$(echo "$URL" | sed -E 's|https?://github.com/([^/]+)/([^/]+).*|\1/\2|')
            gh release download --repo "$CLEAN_REPO" --pattern "*" --dir downloads --clobber || echo "No assets."
          
          # 2. Direct Download
          else
            cd downloads
            curl -L -O -J "$URL" || wget -q "$URL"
            cd ..
          fi

          # 3. Smart Splitting (95MB chunks)
          find downloads/ -type f -size +95M | while read FILE; do
            split -b 95M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE.part"
            rm "$FILE"
          done

      - name: Update UI
        run: |
          python3 - <<EOF
          import os, urllib.parse, re

          if not os.path.exists('downloads'): exit(0)
          files = sorted(os.listdir('downloads'))
          if not files: exit(0)

          table_rows = ""
          has_split = False
          base_name = ""

          for f in files:
              size = f"{os.path.getsize('downloads/'+f) / (1024*1024):.1f} MB"
              enc_name = urllib.parse.quote(f)
              # Link to the file directly in the repo to avoid github.io blocks
              raw_url = f"https://github.com/${{ github.repository }}/blob/main/downloads/{enc_name}?raw=true"
              table_rows += f"| {f} | {size} | [⬇️ Download]({raw_url}) |\n"
              if ".part" in f:
                  has_split = True
                  base_name = f.split('.part')[0]

          with open('README.md', 'r') as f: content = f.read()
          
          new_section = "### 📥 Active Downloads\n"
          new_section += "| File Name | Size | Link |\n| :--- | :--- | :--- |\n"
          new_section += table_rows
          
          if has_split:
              new_section += f"\n**🧩 Join Command (Windows):**\n"
              new_section += f"\`Get-Content downloads/{base_name}.part* -ReadCount 0 | Set-Content \"{base_name}\" -Encoding Byte\`\n"

          pattern = r"<!-- DL_START -->.*?<!-- DL_END -->"
          replacement = f"<!-- DL_START -->\n{new_section}\n<!-- DL_END -->"
          
          if "<!-- DL_START -->" not in content:
              content += f"\n{replacement}"
          else:
              content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f: f.write(content)
          EOF

      - name: Push to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🚀 File Grabbed" || exit 0
          git push --force
