name: Universal-Cloud-Grabber
on:
  push:
    paths:
      - 'GIMME-LINKS.txt'
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          # Use -qq to minimize logs and prevent hangs
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg wget curl
          pip install --upgrade yt-dlp

      - name: Smart Download
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(cat GIMME-LINKS.txt | xargs)
          mkdir -p downloads
          rm -rf downloads/*
          
          if [ -z "$URL" ]; then
            echo "Empty link file."
            exit 0
          fi

          echo "Processing: $URL"

          # Logic for Github Repos
          if [[ $URL =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            gh release download --repo "$URL" --archive zip --output "downloads/repo-source.zip"
          
          # Logic for Video Sites (Added --no-playlist and --buffer-size)
          elif [[ $URL == *"youtube.com"* ]] || [[ $URL == *"youtu.be"* ]] || [[ $URL == *"twitter.com"* ]] || [[ $URL == *"tiktok.com"* ]]; then
            yt-dlp -f 'best' --no-playlist --no-warnings -o "downloads/%(title)s.%(ext)s" "$URL"
          
          # Logic for Direct Links
          else
            # Try wget first, if it fails, try curl
            wget -q --show-progress -N -P downloads/ "$URL" || curl -L -O --output-dir downloads/ "$URL"
          fi

      - name: Split and Generate UI
        id: process
        run: |
          # Split files larger than 90MB (GitHub limit is 100MB)
          find downloads/ -type f -size +90M | while read FILE; do
            split -b 90M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE."
            rm "$FILE"
          done
          
          TABLE_DATA="| File Name | Size | Link |\n| :--- | :--- | :--- |\n"
          HAS_SPLIT="false"
          MAIN_NAME=""

          # Generate the table rows
          for f in $(ls downloads/ | sort -V); do
            SIZE=$(du -sh "downloads/$f" | cut -f1)
            # URL Encoding for the filename
            ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$f'''))")
            RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/downloads/$ENC"
            TABLE_DATA="${TABLE_DATA}| $f | $SIZE | [Download]($RAW_URL) |\n"
            
            if [[ "$f" == *.[1-9] ]]; then
               HAS_SPLIT="true"
               MAIN_NAME="${f%.*}"
            fi
          done

          # Use a temp file for the table to avoid bash variable escaping issues
          echo -e "$TABLE_DATA" > table_content.tmp
          echo "has_split=$HAS_SPLIT" >> $GITHUB_OUTPUT
          echo "main_name=$MAIN_NAME" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          SPLIT="${{ steps.process.outputs.has_split }}"
          FNAME="${{ steps.process.outputs.main_name }}"

          # Create the Join Commands
          if [ "$SPLIT" = "true" ]; then
             L_CMD="cat \"downloads/$FNAME\".* > \"$FNAME\""
             W_CMD="Get-Content \"downloads/$FNAME\".* -ReadCount 10mb -Encoding Byte | Set-Content \"$FNAME\" -Encoding Byte"
          else
             L_CMD="# No parts to join!"
             W_CMD="# No parts to join!"
          fi

          # Robust README update using Python (sed is too risky for this)
          python3 - <<EOF
          import os
          with open('README.md', 'r') as f:
              content = f.read()

          with open('table_content.tmp', 'r') as f:
              table = f.read()

          # Replace Table
          import re
          table_pattern = r"<!-- TABLE_START -->.*?<!-- TABLE_END -->"
          table_new = f"<!-- TABLE_START -->\n{table}\n<!-- TABLE_END -->"
          content = re.sub(table_pattern, table_new, content, flags=re.DOTALL)

          # Replace Linux Cmd
          l_pattern = r"<!-- LINUX_CMD_START -->.*?<!-- LINUX_CMD_END -->"
          l_new = f"<!-- LINUX_CMD_START -->\n\`\`\`bash\n{L_CMD}\n\`\`\`\n<!-- LINUX_CMD_END -->"
          content = re.sub(l_pattern, l_new, content, flags=re.DOTALL)

          # Replace Windows Cmd
          w_pattern = r"<!-- WIN_CMD_START -->.*?<!-- WIN_CMD_END -->"
          w_new = f"<!-- WIN_CMD_START -->\n\`\`\`powershell\n{W_CMD}\n\`\`\`\n<!-- WIN_CMD_END -->"
          content = re.sub(w_pattern, w_new, content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Push to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Updated downloads and README" || exit 0
          git push --force
