name: Universal-Cloud-Grabber
on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Paste your download link here'
        required: true
        default: ''
  push:
    paths:
      - 'GIMME-LINKS.txt'

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: sudo apt-get update && sudo apt-get install -y wget curl

      - name: Core Engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use input from button OR the text file
          URL="${{ github.event.inputs.link }}"
          if [ -z "$URL" ]; then
            URL=$(cat GIMME-LINKS.txt | xargs)
          fi
          
          mkdir -p downloads
          # CRITICAL: This wipes the old file so the repo stays clean
          rm -rf downloads/*
          
          if [ -z "$URL" ]; then echo "No link provided."; exit 0; fi

          # 1. GitHub Repo Logic
          if [[ $URL == *"github.com"* ]]; then
            CLEAN_REPO=$(echo "$URL" | sed -E 's|https?://github.com/([^/]+)/([^/]+).*|\1/\2|')
            gh release download --repo "$CLEAN_REPO" --pattern "*" --dir downloads --clobber || echo "No assets."
          
          # 2. Direct Download (IDM Style)
          else
            cd downloads
            curl -L -O -J "$URL" || wget -q "$URL"
            cd ..
          fi

          # 3. SMART SPLITTING (The 100MB Bypass)
          # Files over 95MB get cut into .part1, .part2, etc.
          find downloads/ -type f -size +95M | while read FILE; do
            echo "Splitting $FILE..."
            split -b 95M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE.part"
            rm "$FILE"
          done

      - name: Update UI Table & Join Commands
        run: |
          python3 - <<EOF
          import os, urllib.parse, re

          if not os.path.exists('downloads'): exit(0)
          files = sorted(os.listdir('downloads'))
          if not files: exit(0)

          table_rows = ""
          has_split = False
          base_name = ""

          for f in files:
              size_mb = os.path.getsize('downloads/'+f) / (1024*1024)
              size_str = f"{size_mb:.1f} MB"
              enc_name = urllib.parse.quote(f)
              
              # Using the "Blob" link to bypass filters
              raw_url = f"https://github.com/${{ github.repository }}/blob/main/downloads/{enc_name}?raw=true"
              
              table_rows += f"| {f} | {size_str} | [⬇️ Download]({raw_url}) |\n"
              
              if ".part" in f:
                  has_split = True
                  # Detect the original name (e.g., video.mp4)
                  base_name = f.split('.part')[0]

          # Read README
          with open('README.md', 'r') as f: content = f.read()
          
          # Build the dynamic UI section
          ui_output = "### 📥 Current Download\n"
          ui_output += "| File Name | Size | Link |\n| :--- | :--- | :--- |\n"
          ui_output += table_rows
          
          if has_split:
              ui_output += f"\n**🧩 How to Join this file:**\n"
              ui_output += f"If you downloaded multiple parts, use this command to merge them back into **{base_name}**:\n\n"
              ui_output += f"- **Windows (PowerShell):**\n"
              ui_output += f"\`\`\`powershell\nGet-Content downloads/{base_name}.part* -ReadCount 0 | Set-Content \"{base_name}\" -Encoding Byte\n\`\`\`\n"
              ui_output += f"- **Linux / Mac / Termux:**\n"
              ui_output += f"\`\`\`bash\ncat downloads/{base_name}.part* > \"{base_name}\"\n\`\`\`\n"

          # Replace the content between markers
          pattern = r"<!-- DL_START -->.*?<!-- DL_END -->"
          replacement = f"<!-- DL_START -->\n{ui_output}\n<!-- DL_END -->"
          
          if "<!-- DL_START -->" not in content:
              content += f"\n{replacement}"
          else:
              content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f: f.write(content)
          EOF

      - name: Push to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🚀 File Grabbed and Split" || exit 0
          git push --force
