name: Universal-Cloud-Grabber
on:
  push:
    paths:
      - 'GIMME-LINKS.txt'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Advanced Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install -U yt-dlp requests beautifulsoup4

      - name: Run Download Engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/engine.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🚀 Engine Update: Added new downloads" || exit 0
          git push --force
