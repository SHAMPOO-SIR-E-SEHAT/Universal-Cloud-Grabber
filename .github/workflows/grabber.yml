name: Universal-Cloud-Grabber
on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Paste Link / Repo OR type CLEAR'
        required: true
  push:
    paths:
      - 'GIMME-LINKS.txt'

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: sudo apt-get update && sudo apt-get install -y wget curl

      - name: Core Engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${{ github.event.inputs.link }}"
          if [ -z "$URL" ]; then URL=$(cat GIMME-LINKS.txt | xargs); fi
          
          mkdir -p downloads
          rm -rf downloads/*
          
          if [ "$URL" == "CLEAR" ]; then
             echo "" > GIMME-LINKS.txt
             echo "status=cleared" >> $GITHUB_OUTPUT
             exit 0
          fi

          echo "$URL" > GIMME-LINKS.txt
          echo "status=downloading" >> $GITHUB_OUTPUT
          URL_CLEAN=$(echo "$URL" | sed 's|/*$||')

          # --- LOGIC BRANCHING ---
          
          # 1. Check if it's a SPECIFIC GitHub file link (contains /releases/download/)
          if [[ "$URL_CLEAN" == *"github.com"* ]] && [[ "$URL_CLEAN" == *"/releases/download/"* ]]; then
             echo "🔗 TYPE: Specific GitHub File"
             cd downloads
             curl -L -O -J "$URL_CLEAN" || wget -q "$URL_CLEAN"
             cd ..

          # 2. Check if it's a GitHub REPO (Grab All Assets)
          elif [[ "$URL_CLEAN" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9._-]+$ ]] || [[ "$URL_CLEAN" == *"github.com"* ]]; then
             echo "📦 TYPE: GitHub Repository (Full Release)"
             if [[ "$URL_CLEAN" == *"github.com"* ]]; then
                TARGET=$(echo "$URL_CLEAN" | sed -E 's|.*github.com/([^/]+)/([^/ ]+).*|\1/\2|' | cut -d'/' -f1,2)
             else
                TARGET="$URL_CLEAN"
             fi
             echo "Fetching all assets from: $TARGET"
             gh release download --repo "$TARGET" --pattern "*" --dir downloads --clobber || echo "No release assets found."

          # 3. Everything else is a Direct Link
          else
             echo "🔗 TYPE: Direct Download Link"
             cd downloads
             curl -L -O -J "$URL_CLEAN" || wget -q "$URL_CLEAN"
             cd ..
          fi

          # --- SMART SPLITTING ---
          find downloads/ -type f -size +95M | while read FILE; do
            echo "✂️ Splitting: $FILE"
            split -b 95M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE.part"
            rm "$FILE"
          done

      - name: Update UI (README)
        run: |
          python3 - <<EOF
          import os, urllib.parse, re

          status = "${{ steps.engine.outputs.status }}"
          ui_output = ""
          
          if status == "cleared":
              ui_output = "### 📥 No Active Downloads\n*Run a workflow to see files here.*"
          else:
              if not os.path.exists('downloads'): exit(0)
              files = sorted([f for f in os.listdir('downloads') if os.path.isfile(os.path.join('downloads', f))])
              
              if files:
                  split_groups = set()
                  table = "### 📥 Current Downloads\n| File Name | Size | Link |\n| :--- | :--- | :--- |\n"
                  for f in files:
                      size = f"{os.path.getsize('downloads/'+f) / (1024*1024):.1f} MB"
                      enc_name = urllib.parse.quote(f)
                      raw_url = f"https://raw.githubusercontent.com/${{ github.repository }}/main/downloads/{enc_name}"
                      table += f"| {f} | {size} | [⬇️ Download]({raw_url}) |\n"
                      if ".part" in f:
                          split_groups.add(f.split('.part')[0])
                  
                  ui_output = table
                  if split_groups:
                      ui_output += "\n**🧩 Join Commands:**\n"
                      for base in sorted(split_groups):
                          ui_output += f"#### For {base}:\n"
                          ui_output += f"- **Windows (PowerShell):** \`Get-Content downloads/{base}.part* -ReadCount 0 | Set-Content \"{base}\" -Encoding Byte\`\n"
                          ui_output += f"- **Linux/Mac/Termux:** \`cat downloads/{base}.part* > \"{base}\"\`\n\n"
              else:
                  ui_output = "### 📥 No Active Downloads\n*Run a workflow to see files here.*"

          with open('README.md', 'r') as f: content = f.read()
          pattern = r"<!-- DL_START -->.*?<!-- DL_END -->"
          replacement = f"<!-- DL_START -->\n{ui_output}\n<!-- DL_END -->"
          content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          with open('README.md', 'w') as f: f.write(content)
          EOF

      - name: Push to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -a -m "🚀 Sync: Link Logged & Files Updated [skip ci]" || exit 0
          git push --force
