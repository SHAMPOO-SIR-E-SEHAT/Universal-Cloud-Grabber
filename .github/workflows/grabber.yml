name: Universal-Cloud-Grabber
on:
  push:
    paths:
      - 'GIMME-LINKS.txt'
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget python3-pip
          pip install yt-dlp beautifulsoup4 requests
          # We'll use bs4 for more complex scraping later, but wget is primary now

      - name: Smart Download
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(cat GIMME-LINKS.txt | xargs)
          mkdir -p downloads
          rm -rf downloads/*
          
          if [ -z "$URL" ]; then
            echo "Empty link file. Clearing..."
          elif [[ $URL =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            echo "Downloading GitHub release..."
            gh release download --repo "$URL" --archive zip --output "downloads/repo-source.zip"
          elif [[ $URL == *"youtube.com"* ]] || [[ $URL == *"youtu.be"* ]] || [[ $URL == *"twitter.com"* ]] || [[ $URL == *"tiktok.com"* ]]; then
            echo "Downloading video..."
            yt-dlp -f 'best' -o "downloads/%(title)s.%(ext)s" "$URL"
          else
            echo "Scanning website for files: $URL"
            # Enhanced Wget:
            # -r: recursive
            # -l2: depth of 2 (look one level deeper than the given URL)
            # -nd: no directories (flatten all files in downloads/)
            # -A "pattern": accept only files matching pattern
            # -P downloads/: save to downloads/ directory
            # --reject "pattern": reject specific files (e.g., images, css, js)
            # --timeout=10: stop if a link takes too long
            # --tries=3: retry 3 times if connection fails
            wget -r -l2 -nd -A "deb,exe,zip,msi,pkg,dmg,apk,rpm,gz,7z,rar,pdf" \
                 --reject "gif,jpg,jpeg,png,css,js,ico,svg,woff,woff2,ttf,eot" \
                 --timeout=15 --tries=3 \
                 -P downloads/ "$URL"

            # Fallback to direct download if wget finds nothing useful or if the URL is a direct file
            if [ -z "$(ls -A downloads/)" ]; then
              echo "Wget found no suitable files, attempting direct download..."
              curl -LJO "$URL" --output-dir downloads/ || echo "Direct download failed."
            fi
          fi

      - name: Split and Generate UI
        id: process
        run: |
          # Split files over 90MB
          find downloads/ -type f -size +90M | while read FILE; do
            split -b 90M -d --numeric-suffixes=1 --suffix-length=1 "$FILE" "$FILE."
            rm "$FILE"
          done
          
          TABLE_DATA=""
          HAS_SPLIT="false"
          MAIN_NAME=""

          # Generate Table Rows
          for f in $(ls downloads/ | sort -V); do
            SIZE=$(du -sh "downloads/$f" | cut -f1)
            ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$f'))")
            RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/downloads/$ENC"
            TABLE_DATA="${TABLE_DATA}| $f | $SIZE | [Download]($RAW_URL) |\n"
            
            if [[ "$f" == *.[1-9] ]]; then
               HAS_SPLIT="true"
               MAIN_NAME="${f%.*}"
            fi
          done

          echo -e "TABLE_DATA<<EOF\n$TABLE_DATA\nEOF" >> $GITHUB_OUTPUT
          echo "has_split=$HAS_SPLIT" >> $GITHUB_OUTPUT
          echo "main_name=$MAIN_NAME" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          TABLE="${{ steps.process.outputs.TABLE_DATA }}"
          SPLIT="${{ steps.process.outputs.has_split }}"
          FNAME="${{ steps.process.outputs.main_name }}"

          # Update Table
          sed -i '/<!-- TABLE_START -->/,/<!-- TABLE_END -->/{ /<!-- TABLE_START -->/b; /<!-- TABLE_END -->/b; d; }' README.md
          echo -e "$TABLE" > table.tmp
          sed -i '/<!-- TABLE_START -->/r table.tmp' README.md
          rm table.tmp
          
          # Generate Commands
          if [ "$SPLIT" = "true" ]; then
             L_CMD="cat \"downloads/$FNAME\".* > \"$FNAME\""
             W_CMD="Get-Content \"downloads/$FNAME\".* -ReadCount 10mb -Encoding Byte | Set-Content \"$FNAME\" -Encoding Byte"
          else
             L_CMD="# No parts to join!"
             W_CMD="# No parts to join!"
          fi

          # Update Join Commands
          sed -i '/<!-- LINUX_CMD_START -->/,/<!-- LINUX_CMD_END -->/{ /<!-- LINUX_CMD_START -->/b; /<!-- LINUX_CMD_END -->/b; d; }' README.md
          sed -i "/<!-- LINUX_CMD_START -->/a \`\`\`bash\n$L_CMD\n\`\`\`" README.md
          
          sed -i '/<!-- WIN_CMD_START -->/,/<!-- WIN_CMD_END -->/{ /<!-- WIN_CMD_START -->/b; /<!-- WIN_CMD_END -->/b; d; }' README.md
          sed -i "/<!-- WIN_CMD_START -->/a \`\`\`powershell\n$W_CMD\n\`\`\`" README.md

      - name: Push to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Updated files" || echo "No changes to commit"
          git push --force
